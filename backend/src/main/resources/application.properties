# Server Configuration
server.port=8080

# Database Configuration (environment variables with defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:khetrent}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (secret key 256-bit+ and 24h expiration)
jwt.secret=${JWT_SECRET:KhetRentSecureAgriculturalPlatformSecretKeyForJwtAuthentication2026!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
